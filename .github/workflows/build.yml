name: Build

# 推送即构建：任意分支 push / 手动触发；推送 v* tag 时自动创建 Release 并上传裸二进制（不打包 zip）
on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  # tag 推送产生的构建不做中断，避免上传 Release 产物到一半被取消
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ matrix.assetname }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x64：CGO_ENABLED=0 的纯静态 ELF（无 PT_INTERP / 无 DT_NEEDED）
          - goos: linux
            goarch: amd64
            assetname: linux-x64
            binary: xray-vless
          # Windows x64：控制台版 exe
          - goos: windows
            goarch: amd64
            assetname: windows-x64
            binary: xray-vless.exe
    runs-on: ubuntu-latest
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: 0
      BINARY: ${{ matrix.binary }}
      ASSET_NAME: ${{ matrix.assetname }}
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7

      - name: Show workflow information
        run: |
          echo "GOOS: $GOOS, GOARCH: $GOARCH, CGO_ENABLED: $CGO_ENABLED, RELEASE_NAME: $ASSET_NAME"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Get project dependencies
        run: go mod download

      - name: Build xray-vless
        run: |
          mkdir -p build_assets
          BUILD_ID=$(git describe --always --dirty 2>/dev/null || echo custom)
          echo "BUILD_ID=${BUILD_ID}" >> "$GITHUB_ENV"
          ASSET_FILE="xray-vless-${ASSET_NAME}"
          if [ "$GOOS" = windows ]; then ASSET_FILE="${ASSET_FILE}.exe"; fi
          echo "ASSET_FILE=${ASSET_FILE}" >> "$GITHUB_ENV"
          echo "Building for ${GOOS}-${GOARCH} (commit ${BUILD_ID})..."
          go build -o "build_assets/${BINARY}" \
            -trimpath -buildvcs=false \
            -gcflags="all=-l=4" \
            -ldflags="-X github.com/xtls/xray-core/core.build=${BUILD_ID} -s -w -buildid=" \
            -v ./main
          mv "build_assets/${BINARY}" "build_assets/${ASSET_FILE}"
          ls -l build_assets/

      - name: Verify pure static linking
        if: matrix.goos == 'linux'
        run: |
          FILE="build_assets/${ASSET_FILE}"
          file "$FILE"
          if readelf -lW "$FILE" | grep -q 'INTERP'; then
            echo "::error::Linux 产物含 PT_INTERP，说明仍在动态加载 libc，非纯静态"
            exit 1
          fi
          if readelf -dW "$FILE" | grep -q 'NEEDED'; then
            echo "::error::Linux 产物存在 DT_NEEDED 动态依赖"
            exit 1
          fi
          echo "静态链接校验通过（无 PT_INTERP / 无 DT_NEEDED）"
          ldd "$FILE" 2>&1 || true

      - name: Smoke test
        if: matrix.goos == 'linux'
        run: |
          ./build_assets/${ASSET_FILE} version
          ./build_assets/${ASSET_FILE} x25519
          ./build_assets/${ASSET_FILE} uuid
          ./build_assets/${ASSET_FILE} help

      - name: Generate checksums
        shell: bash
        run: |
          FILE=build_assets/${ASSET_FILE}
          DGST=$FILE.dgst
          rm -f "$DGST"
          for METHOD in {"md5","sha1","sha256","sha512"}
          do
            openssl dgst -$METHOD $FILE | sed 's/([^)]*)//g' >>$DGST
          done
          cat "$DGST"
          ls -l build_assets/

      - name: Upload files to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: xray-vless-${{ env.ASSET_NAME }}
          path: |
            ./build_assets/*
          if-no-files-found: error
          compression-level: 0

      - name: Upload binaries to release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          files: |
            ./build_assets/${{ env.ASSET_FILE }}
            ./build_assets/${{ env.ASSET_FILE }}.dgst
          fail_on_unmatched_files: true
